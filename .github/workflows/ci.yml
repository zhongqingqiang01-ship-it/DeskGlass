name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Core behavior tests
        run: ./test.sh
      - name: Public asset tests
        run: npm test
      - name: Build and package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DeskGlass-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
